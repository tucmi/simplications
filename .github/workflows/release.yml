name: Release APK and Windows MSIX

on:
  release:
    types:
      - published
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK filename
        id: apk
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION="${VERSION}"
          VERSION="${VERSION#v}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="simplications-${VERSION}-android-release.apk"
          APK_TARGET="build/app/outputs/flutter-apk/${APK_NAME}"
          cp "${APK_SRC}" "${APK_TARGET}"
          echo "apk_path=${APK_TARGET}" >> "${GITHUB_OUTPUT}"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}

  build-windows-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release Windows app
        run: flutter build windows --release

      - name: Import MSIX signing certificate
        id: import-msix-certificate
        shell: pwsh
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERT_PFX_BASE64)) {
            throw 'Missing required secret: MSIX_CERT_PFX_BASE64'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'msix-signing.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'msix-signing.cer'
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))
          $certPassword = ConvertTo-SecureString -String "${{ secrets.MSIX_CERT_PASSWORD }}" -AsPlainText -Force
          $importedCert = Import-PfxCertificate -FilePath $certPath -Password $certPassword -CertStoreLocation 'Cert:\CurrentUser\My'
          Export-Certificate -Cert $importedCert -FilePath $cerPath | Out-Null
          "cert_path=$certPath" >> $env:GITHUB_OUTPUT
          "cer_path=$cerPath" >> $env:GITHUB_OUTPUT

      - name: Create MSIX installer
        shell: pwsh
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERT_PASSWORD)) {
            throw 'Missing required secret: MSIX_CERT_PASSWORD'
          }
          dart run msix:create --build-windows false --install-certificate false --certificate-path "${{ steps.import-msix-certificate.outputs.cert_path }}" --certificate-password "$env:MSIX_CERT_PASSWORD"

      - name: Prepare versioned Windows MSIX filename
        id: msix
        shell: pwsh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $msixSrc = Get-ChildItem -Path 'build' -Filter '*.msix' -Recurse | Select-Object -First 1
          if (-not $msixSrc) {
            throw 'MSIX package not found under build/'
          }
          $msixTarget = "build/simplications-$version-windows-release.msix"
          Copy-Item -Path $msixSrc.FullName -Destination $msixTarget -Force
          "msix_path=$msixTarget" >> $env:GITHUB_OUTPUT

      - name: Attach MSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.msix.outputs.msix_path }}
            ${{ steps.import-msix-certificate.outputs.cer_path }}
          append_body: true
          body: |
            ## Internal Testing: Trust Install for Windows MSIX
            If SmartScreen or certificate trust blocks install, follow the tester guide:
            https://github.com/${{ github.repository }}/blob/main/docs/msix-trust-install.md

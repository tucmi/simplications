name: Release Artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK filename
        id: apk
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION="${VERSION}"
          VERSION="${VERSION#v}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="simplications-${VERSION}-android-release.apk"
          APK_TARGET="build/app/outputs/flutter-apk/${APK_NAME}"
          cp "${APK_SRC}" "${APK_TARGET}"
          echo "apk_path=${APK_TARGET}" >> "${GITHUB_OUTPUT}"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}

  build-windows-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release Windows app
        run: flutter build windows --release

      - name: Build MSIX installer
        id: msix
        shell: pwsh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $outputDir = 'build/windows/msix'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          dart run msix:create --build-windows false --install-certificate false --output-path $outputDir --output-name "simplications-$version-windows-installer"
          $msixPath = (Get-ChildItem -Path $outputDir -Filter '*.msix' | Select-Object -First 1).FullName
          if (-not $msixPath) {
            throw 'MSIX output was not created.'
          }
          "msix_path=$msixPath" >> $env:GITHUB_OUTPUT

      - name: Attach MSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.msix.outputs.msix_path }}

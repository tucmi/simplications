name: Release APK and Windows Installer

on:
  release:
    types:
      - published
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK filename
        id: apk
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION="${VERSION}"
          VERSION="${VERSION#v}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="simplications-${VERSION}-android-release.apk"
          APK_TARGET="build/app/outputs/flutter-apk/${APK_NAME}"
          cp "${APK_SRC}" "${APK_TARGET}"
          echo "apk_path=${APK_TARGET}" >> "${GITHUB_OUTPUT}"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}

  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build release Windows app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Inno Setup installer
        id: inno
        shell: pwsh
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          if (-not (Test-Path 'build/windows/x64/runner/Release/simplications.exe')) {
            throw 'Windows release executable not found under build/windows/x64/runner/Release/'
          }
          iscc "/DAppVersion=$version" ".github/installer/simplications.iss"
          $installerTarget = "build/simplications-$version-windows-setup.exe"
          if (-not (Test-Path $installerTarget)) {
            $fallbackInstaller = Get-ChildItem -Path 'build' -Filter '*.exe' -Recurse |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $fallbackInstaller) {
              throw 'Inno Setup installer was not generated under build/'
            }
            Copy-Item -Path $fallbackInstaller.FullName -Destination $installerTarget -Force
          }
          "installer_path=$installerTarget" >> $env:GITHUB_OUTPUT

      - name: Attach Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.inno.outputs.installer_path }}
